name: flutter_doc_capture_kit
description: >-
  Android-first document capture with manual crop and rotation, on-device OCR,
  editable text, and text-only or image-backed searchable PDF export.
version: 0.1.0-dev.1
repository: https://github.com/yaseenpv01/flutter_doc_capture_kit
issue_tracker: https://github.com/yaseenpv01/flutter_doc_capture_kit/issues

environment:
  sdk: ^3.11.3
  flutter: ">=3.41.5"

platforms:
  android:

topics:
  - document-scanner
  - ocr
  - pdf
  - flutter

dependencies:
  flutter:
    sdk: flutter
  google_mlkit_text_recognition: ^0.15.1
  image: ^4.10.1
  pdf: ^3.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
